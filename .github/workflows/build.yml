name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  mac:
    needs: test
    # Intel runners have far more capacity than the arm64 pool; electron-builder
    # can package both architectures from either host.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build; see README for first-launch steps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build DMGs (arm64 + x64)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
      - run: ls -la dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LightBox-Previs-mac
          path: dist/*.dmg
          if-no-files-found: error
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
